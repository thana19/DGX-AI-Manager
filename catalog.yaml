# AI Server v2 — catalog ของ vendor
#
# ไฟล์นี้ vendor ดูแล · ผู้ใช้เพิ่มโมเดลเองจะไปอยู่ที่ ~/.aiserver2/user-models.json (ดู docs/adr/0001-registry-split.md)
# schema เดียวกันทั้งสองไฟล์ · validate ด้วย pydantic ใน server/catalog.py
#
# arch: อ่านจาก GGUF header ของไฟล์จริงเมื่อ 2026-08-29 (ไม่ใช่ค่าที่จดด้วยมือ — ของ v1 เคยจดผิดเป็น qwen4_exp)
# requires: ปล่อยว่างได้ — ระบบเช็คจริงจาก arch list ใน libllama.so ของ engine ที่ติดตั้งอยู่
#           ใส่เมื่อ engine ไม่มี arch list ให้อ่าน (vllm / ds4) หรือมีข้อบังคับอื่น
models:
  - id: ds4-flash-unsloth-iq2xxs
    name: "DeepSeek-V4-Flash IQ2 (Unsloth)"
    engine: llamacpp
    path: ~/models/gguf/deepseek-v4-flash-0731/DeepSeek-V4-Flash-0731-UD-IQ2_XXS-00001-of-00003.gguf
    arch: deepseek4
    source_repo: unsloth/DeepSeek-V4-Flash-0731-GGUF
    ctx: 131072
    ctx_train: 1048576
    need_gb: 105
    args: ""
    dl:
      - https://huggingface.co/unsloth/DeepSeek-V4-Flash-0731-GGUF/resolve/main/UD-IQ2_XXS/DeepSeek-V4-Flash-0731-UD-IQ2_XXS-00001-of-00003.gguf
